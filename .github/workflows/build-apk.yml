name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build auditor + test app (debug APKs)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :testapp:assembleDebug --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p apk-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk apk-artifacts/
          cp testapp/build/outputs/apk/debug/testapp-debug.apk apk-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: AppRiskAuditor-apks
          path: apk-artifacts/*.apk
          if-no-files-found: error
